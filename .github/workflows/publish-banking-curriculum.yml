name: Publish reviewed international banking lessons
on:
  push:
    branches: [main]
    paths:
      - "banking_curriculum/**"
      - "scripts/apply_banking_curriculum.py"
      - ".github/workflows/publish-banking-curriculum.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: banking-curriculum-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout most recent main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge approved bank lessons
        run: python scripts/apply_banking_curriculum.py
      - name: Validate complete academy feed
        run: python scripts/validate_academy_content.py
      - name: Commit only when content changed
        shell: bash
        run: |
          if git diff --quiet -- academy_content.json; then
            echo "No updates required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy_content.json
          git commit -m "Publish banking current accounts lessons in academy feed"
          git pull --rebase origin main
          git push origin HEAD:main
