name: Publish reviewed international banking lessons
on:
  push:
    branches: [main]
    paths:
      - "banking_curriculum/**"
      - "scripts/apply_banking_curriculum.py"
      - ".github/workflows/publish-banking-curriculum.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: banking-curriculum-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge validate and push with safe retries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt using the latest remote feed"
            git fetch origin main
            git reset --hard origin/main
            python scripts/apply_banking_curriculum.py
            python scripts/validate_academy_content.py --base-ref HEAD
            if git diff --quiet -- academy_content.json; then
              echo "Banking current accounts already present"
              exit 0
            fi
            git add academy_content.json
            git commit -m "Publish banking current accounts lessons in academy feed"
            if git push origin HEAD:main; then
              echo "Bank lessons successfully published"
              exit 0
            fi
            echo "Remote changed during upload; regenerate from new head"
          done
          echo "Unable to publish after four safe retries" >&2
          exit 1
